<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forma — Sample workspace</title><style>
*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#24312d;background:#f6f8f6}button,input{font:inherit}header{height:76px;border-bottom:1px solid #e3e8e3;display:flex;align-items:center;justify-content:space-between;padding:0 48px;background:#fff}.brand{font-size:23px;font-weight:650;letter-spacing:-1px}.mark{display:inline-grid;place-items:center;background:#315f48;color:#fff;width:30px;height:30px;border-radius:9px;margin-right:10px;font-size:18px}small{color:#839189;font-size:12px}main{max-width:990px;margin:64px auto;padding:0 30px}h1{font-size:34px;letter-spacing:-1.2px;font-weight:600;margin:0 0 10px}p{color:#7b8881;line-height:1.6}.login{max-width:380px;margin:80px auto}.login h1{font-size:29px}label{display:block;font-size:13px;margin-top:24px;margin-bottom:8px}input{padding:13px 15px;border:1px solid #dbe2dc;background:#fff;border-radius:7px;width:100%;outline:none}input:focus{border-color:#64846e;box-shadow:0 0 0 3px #64846e15}button{border:0;background:#315f48;color:#fff;padding:13px 20px;border-radius:7px;cursor:pointer;font-weight:550}.login button{width:100%;margin-top:26px}.hint{font-size:12px;padding:12px;background:#ebf0eb;border-radius:8px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:32px 0 40px}.stat,.project{background:#fff;border:1px solid #e2e8e2;border-radius:10px;padding:24px}.stat strong{font-size:28px;display:block;margin-top:12px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.section-head input{width:240px}.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.project .icon{background:#edf0fd;color:#6773a8;width:39px;height:39px;border-radius:10px;display:grid;place-items:center;font-size:20px}.project h3{font-size:16px;font-weight:600;margin:22px 0 8px}.project p{font-size:13px}.line{height:4px;background:#e8eee9;border-radius:5px;margin:24px 0 15px}.line i{display:block;height:4px;background:#719a7d;border-radius:5px}.pill{background:#e6f0e8;color:#4e7e5b;padding:5px 9px;border-radius:5px;font-size:11px}.footer{display:flex;justify-content:space-between;align-items:center}#error{color:#ba4949}.avatar{border-radius:50%;width:30px;height:30px;background:#efe9dd;display:grid;place-items:center;color:#8c7b59;font-size:11px}@media(max-width:650px){header{padding:0 20px}.projects,.stats{grid-template-columns:1fr}.top{display:block}}
</style></head><body><header><div class="brand"><span class="mark">f</span>forma<span style="font-weight:400;color:#b9c2bb;margin:0 16px">/</span><small>Personal workspace</small></div><div class="avatar">AL</div></header><main id="app"></main>
<script>
const app=document.getElementById('app');
function login(){app.innerHTML='<form class="login"><h1>A little focus. A lot of progress.</h1><p>Sign in to your workspace.</p><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@company.com" required><label for="password">Password</label><input id="password" name="password" type="password" placeholder="Your password" required><button type="submit">Sign in</button><p id="error" role="alert"></p><p class="hint">Sample account: demo@autostage.dev<br>Password: stagehand-demo</p></form>';document.querySelector('form').onsubmit=e=>{e.preventDefault();if(document.querySelector('[name=email]').value==='demo@autostage.dev'&&document.querySelector('[name=password]').value==='stagehand-demo'){history.replaceState(null,'','?workspace=1');workspace()}else document.getElementById('error').textContent='Your email or password is incorrect.'}}
const projects=[['Website redesign','A fresh direction for our digital home.','72%','In progress','◈'],['Mobile experience','Thoughtful details, on every screen.','45%','In progress','▧'],['Brand guidelines','One cohesive story. Everywhere.','100%','Completed','✳']];
function workspace(){app.innerHTML='<section data-testid="dashboard"><div class="top"><div><small>YOUR WORKSPACE</small><h1 data-testid="welcome" style="margin-top:12px">Welcome back, Alex <span style="color:#719a7d">✳</span></h1><p>Here’s what’s happening with your projects.</p></div><span class="pill">All systems looking good</span></div><div class="stats"><div class="stat"><small>Active projects</small><strong>3</strong></div><div class="stat"><small>Tasks completed</small><strong>24 <small>/ 32</small></strong></div><div class="stat"><small>Team members</small><strong>8</strong></div></div><div class="section-head"><h3>Your projects <small data-testid="count"></small></h3><input data-testid="search" aria-label="Search projects" placeholder="Search projects…"></div><div class="projects" data-testid="projects"></div><p style="margin-top:36px;font-size:12px">Forma is an AutoStage sample application. No real accounts or external services.</p></section>';document.querySelector('[data-testid=search]').oninput=e=>renderProjects(e.target.value);renderProjects('')}
function renderProjects(q){const rows=projects.filter(p=>p[0].toLowerCase().includes(q.toLowerCase()));document.querySelector('[data-testid=count]').textContent=rows.length+' project'+(rows.length===1?'':'s');document.querySelector('[data-testid=projects]').innerHTML=rows.map(p=>'<article class="project"><div class="icon">'+p[4]+'</div><h3>'+p[0]+'</h3><p>'+p[1]+'</p><div class="line"><i style="width:'+p[2]+'"></i></div><div class="footer"><span class="pill">'+p[3]+'</span><small>'+p[2]+'</small></div></article>').join('')}
new URLSearchParams(location.search).get('workspace')==='1'?workspace():login();
</script></body></html>
